name: Build and Publish to PyPI

on:
  # 1. 깃허브에서 'v'로 시작하는 태그(예: v1.0.0)를 생성할 때만 배포가 실행됩니다.
  push:
    tags:
      - 'v*'
  # 2. 빌드 테스트를 위해 수동으로 실행할 수 있는 버튼을 활성화합니다.
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. 다양한 OS 환경에서 바이너리(Wheel) 빌드
  # ==========================================
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Windows, Mac, Linux 3대 운영체제를 동시에 띄워서 빌드합니다.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # GitHub 저장소에서 내 코드를 가상 머신으로 가져옵니다.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm이 Git 태그(버전)를 정확히 읽기 위해 필수!

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.x'

      # - name: Install cibuildwheel
      #   run: python -m pip install cibuildwheel==2.17.0

      # cibuildwheel을 실행하여 모든 파이썬 버전의 Wheel을 공장처럼 찍어냅니다.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.20.0
        env:
          # (선택) 불필요한 파이썬 버전이나 환경은 빌드에서 제외(Skip)합니다.
          # 예: 파이썬 3.7 이하 제외, PyPy 제외, 32비트 환경 제외
          CIBW_SKIP: "cp36-* cp37-* pp* *-win32 *-manylinux_i686"
          CIBW_ARCHS_MACOS: "x86_64 arm64"

          # 테스트에 필요한 도구들을 미리 설치합니다 (여러 개면 띄어쓰기로 구분)
          # CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_REQUIRES: "pytest"

          # 휠이 빌드 & 설치된 직후에 실행할 테스트 명령어입니다.
          # {project}는 가상 머신 내부의 원래 소스코드 폴더(프로젝트 루트)를 가리킵니다.
          CIBW_TEST_COMMAND: "pytest {project}/tests"

          # (선택) 빌드하기 전에 가상 환경에 필요한 라이브러리가 있다면 설치합니다.
          # CIBW_BEFORE_BUILD: "pip install numpy"

      # 만들어진 .whl 파일들을 GitHub Actions 결과물(Artifacts)로 업로드합니다.
      - name: Upload wheels as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # ==========================================
  # 2. 순수 소스 코드(sdist) 압축
  # ==========================================
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # ==========================================
  # 3. PyPI에 최종 업로드 (태그 푸시일 때만)
  # ==========================================
  publish-to-pypi:
    name: Publish Python distribution to PyPI
    # 위의 wheel과 sdist 빌드가 모두 성공했을 때만 실행됩니다.
    needs: [build_wheels, build_sdist]
    # v로 시작하는 태그 푸시일 때만 업로드 진행 (수동 실행 시에는 빌드 테스트만 하고 업로드 생략)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # PyPI의 현대적인 인증 방식(Trusted Publisher)을 위한 필수 권한 설정
    environment:
      name: pypi
      url: https://pypi.org/p/epedit
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

name: Build Cython Wheels

# 코드가 메인 브랜치에 푸시되거나 PR이 생성될 때 자동으로 실행됩니다.
on:
  # 'v1.0.0' 같은 Git 태그가 생성되어 푸시될 때 자동 실행 (릴리즈용)
  push:
    tags:
      - 'v*'

  # 수동 버튼 활성화
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    # Windows, Ubuntu(Linux), macOS 세 가지 가상 머신을 동시에 띄웁니다.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [ubuntu-latest]

    steps:
      # 1. GitHub 저장소에서 내 코드를 가상 머신으로 가져옵니다.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. cibuildwheel을 실행하여 모든 파이썬 버전의 Wheel을 공장처럼 찍어냅니다.
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.20.0
        env:
          # (선택) 불필요한 파이썬 버전이나 환경은 빌드에서 제외(Skip)합니다.
          # 예: 파이썬 3.7 이하 제외, PyPy 제외, 32비트 환경 제외
          CIBW_SKIP: "cp36-* cp37-* pp* *-win32 *-manylinux_i686"
          # CIBW_ARCHS_MACOS: "x86_64 arm64"

          # 테스트에 필요한 도구들을 미리 설치합니다 (여러 개면 띄어쓰기로 구분)
          # CIBW_TEST_REQUIRES: "pytest numpy"
          CIBW_TEST_REQUIRES: "pytest"

          # 휠이 빌드 & 설치된 직후에 실행할 테스트 명령어입니다.
          # {project}는 가상 머신 내부의 원래 소스코드 폴더(프로젝트 루트)를 가리킵니다.
          CIBW_TEST_COMMAND: "pytest {project}/tests"

          # (선택) 빌드하기 전에 가상 환경에 필요한 라이브러리가 있다면 설치합니다.
          # CIBW_BEFORE_BUILD: "pip install numpy"

      # 3. 만들어진 .whl 파일들을 GitHub Actions 결과물(Artifacts)로 업로드합니다.
      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  # (옵션) sdist(소스 배포판)도 하나 만들어두면 좋습니다.
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tool
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0", "Cython>=3.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epedit"
dynamic = ["version"]
description = "EPEdit.py is a high-performance, Cython-based Python library for parsing, editing, and formatting EnergyPlus IDF models."
readme = "README.md"
authors = [
    { name = "Chul-Hong Park" }
]
license = { text = "MIT License" }
keywords = ["EPEdit", "EnergyPlus", "E+", "IDF", "Cython"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
]
requires-python = ">=3.8"

[project.urls]
# Homepage = "https://github.com/chp-rubicell/EPEdit.py"
Repository = "https://github.com/chp-rubicell/EPEdit.py"
Issues = "https://github.com/chp-rubicell/EPEdit.py/issues"

[tool.setuptools_scm]
